  <div class="stage">
    <aside class="stage-note">

      <div class="stage-meta"><span>3,680 词</span><span>离线可用</span><span>添加到主屏幕</span></div>

    <div class="phone">

          <button class="tab" data-tab="library" aria-label="词库">

          <button class="tab" data-tab="stats" aria-label="统计">
